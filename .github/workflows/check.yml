name: Проверка релизов 1С

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 09:00 по Москве
  workflow_dispatch:       # возможность запускать вручную кнопкой

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить библиотеки
        run: pip install -r requirements.txt

      - name: Проверить новости 1С
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_releases.py

      - name: Сохранить записную книжку
        run: |
          git config user.name "1c-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Обновлён список отправленных новостей"
          git push
